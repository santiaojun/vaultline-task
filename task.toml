schema_version = "1"

[metadata]
id        = "vaultline"
version   = 1
title     = "Build a versioned object storage service in Node.js"
profile   = "greenfield"
category  = "new_project"
languages = ["javascript"]

[task]
timeout_sec = 1800
env         = []

[task.environment]
dockerfile = "environment/Dockerfile"
workdir    = "/work/candidate"
network    = "gateway-only"
cpus       = 2
memory     = "2g"

[commands]
verify = "python3 verifier/tests/run_tests.py"

[verifier]
type          = "tests"
timeout_sec   = 900
network       = "none"
deterministic = true

[verifier.environment]
dockerfile = "environment/Dockerfile"
cpus       = 2
memory     = "1g"
